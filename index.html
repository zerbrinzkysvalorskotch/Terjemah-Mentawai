<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">

<title>Ngangan Aman Tawe – Terjemah Bahasa Mentawai</title>
<style>
  :root {
    --bg: #f0fdf0;

    --text: #111111;
    --muted: #6b7280;
    --line: #111111;

    --shadow: rgba(0, 0, 0, .18);

  :root[data-theme="dark"] {
    --bg: #101a16;
    --card: #1a2621;
    --text: #eef3f0;
    --muted: #9db0a7;
    --line: #eef3f0;
    --accent: #3f8f85;
    --field: #14201b;
    --field-out: #223029;
    --border: #3a4c44;
    --shadow: rgba(0, 0, 0, .5);

  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    transition: background .2s, color .2s;

  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 20px; }

  header { display: flex; align-items: center; gap: 14px; padding: 24px 0 14px; border-bottom: 2px solid var(--line); }

  .panel { background: var(--card); border-radius: 18px; padding: 28px; box-shadow: 0 8px 18px var(--shadow); }

  select {
    width: 100%; padding: 11px 12px; font-size: 1rem; color: var(--text); background: var(--field);
    border: 1px solid var(--border); border-radius: 5px;
  }
  textarea {
    width: 100%; height: 220px; margin-top: 12px; padding: 12px; resize: vertical; font: inherit; font-size: 1.05rem;
    color: var(--text); background: var(--field); border: 1px solid var(--border); border-radius: 5px;

  }

  footer { margin-top: 64px; background: var(--footer); padding: 36px 0 48px; }

  .aksi { display: grid; gap: 10px; width: min(100%, 400px); }
  .aksi button, .aksi a {

  .kartu.nonaktif { opacity: .55; justify-content: center; color: var(--muted); font-size: 1.05rem; }

  .aksi a:hover { border-color: var(--accent); }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: .95rem; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; max-width: 90vw; text-align: center; }

<script>
/* ============================================================
   KAMUS — isi dengan entri yang sudah divalidasi penutur.
   Format: [indonesia, mentawai]. Satu baris = satu makna.
   Dua baris di bawah hanya CONTOH untuk uji tampilan;
   harap diverifikasi atau diganti.
   ============================================================ */
// Sumber kamus: nama berkas di repo yang sama, ATAU link CSV Google Sheets
// (Sheets → File → Bagikan → Publikasikan ke web → pilih CSV → salin link).
// Kolom wajib bernama: indonesia, mentawai
const SHEET_ID = "1qu5Esyk7l__lz-hz9FVrPgT-_oUvCZNPWDUOdh_cke0";
// Nama tab yang dimuat, PERSIS sama dengan nama tab di Google Sheets.
// Urutan penting: jika satu kata ada di dua tab, tab yang lebih dulu dipakai.
// Setelah tab dipisah, ganti dengan mis. ["Nomina", "Verba", "Adjektiva", "Campuran"]
const TAB_KAMUS = ["Sheet1"];
let statusKamus = "";
const SUMBER_IMBUHAN = "imbuhan.csv";
const SUMBER_SANDHI = "sandhi.csv";

/* ============================================================
   TAUTAN — isi dengan link asli. Kosongkan ("") jika belum ada.
   ============================================================ */
// Tombol "Saran dan kritik": bisa link Google Form, halaman Issues GitHub,
// atau alamat surel berbentuk "mailto:alamat@contoh.com"
const LINK_SARAN = "";
// Tombol "Kontribusi": misalnya halaman repo GitHub atau berkas CONTRIBUTING
const LINK_KONTRIBUSI = "";

// Daftar buku/panduan. Setiap kartu bisa dipencet dan membuka "url".
// Slot tanpa judul tampil sebagai "Segera hadir".
const BUKU = [
  { judul: "Gramatika Bahasa Mentawai", ket: "Panduan bahasa", url: "" },
  { judul: "", ket: "", url: "" },
  { judul: "", ket: "", url: "" },
  { judul: "", ket: "", url: "" }
];

// Kamus cadangan, dipakai hanya jika berkas/link gagal dimuat.
// Bentuk: [[sinonim Indonesia...], [bentuk Mentawai...]]
let KAMUS = [
  [["rumah adat"], ["uma"]],
  [["tabib adat"], ["sikerei"]]
];

function bacaCSV(teks) {
  const baris = [];
  let sel = "", rec = [], kutip = false;
  for (let i = 0; i < teks.length; i++) {
    const c = teks[i];
    if (kutip) {
      if (c === '"' && teks[i + 1] === '"') { sel += '"'; i++; }
      else if (c === '"') kutip = false;
      else sel += c;
    } else if (c === '"') kutip = true;
    else if (c === ",") { rec.push(sel); sel = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && teks[i + 1] === "\n") i++;
      rec.push(sel); sel = "";
      if (rec.some((x) => x.trim())) baris.push(rec);
      rec = [];
    } else sel += c;
  }
  rec.push(sel);
  if (rec.some((x) => x.trim())) baris.push(rec);
  return baris;
}

async function muatKamus() {
  const ANGKA_ATAS = /[¹²³⁴⁵⁶⁷⁸⁹⁰]/g;
  const hasilTab = new Array(TAB_KAMUS.length).fill(null);
  const gagal = [];
  await Promise.all(TAB_KAMUS.map(async (nama, i) => {
    try {
      const url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
        "/gviz/tq?tqx=out:csv&headers=1&sheet=" + encodeURIComponent(nama);
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const tabel = bacaCSV((await res.text()).replace(/^\uFEFF/, ""));
      const kepala = tabel[0].map((h) => h.trim().toLowerCase());
      const a = kepala.indexOf("indonesia"), b = kepala.indexOf("mentawai"), c = kepala.indexOf("kelas");
      if (a < 0 || b < 0) throw new Error("kolom 'indonesia' dan 'mentawai' tidak ditemukan");
      // kelas: kolom "kelas" per baris > label di pojok (sel A1) > nama tab
      const kelasTab = normKelas(tabel[0][0]) || normKelas(nama);
      const baris = [];
      tabel.slice(1).forEach((r) => {
        const id = (r[a] || "").split(/[;,]/).map((x) => x.trim()).filter(Boolean);
        const mt = (r[b] || "").split(";").map((x) => x.replace(ANGKA_ATAS, "").trim()).filter(Boolean);
        if (id.length && mt.length) baris.push([id, mt, (c >= 0 && normKelas(r[c])) || kelasTab]);
      });
      hasilTab[i] = baris;
    } catch (e) {
      gagal.push(nama + " (" + e.message + ")");
    }
  }));
  const dimuat = hasilTab.filter(Boolean);
  if (dimuat.length) {
    KAMUS = [].concat(...dimuat);
    statusKamus = KAMUS.length + " entri kamus dimuat dari " + dimuat.length + " tab." +
      (gagal.length ? " Gagal: " + gagal.join(", ") + "." : "");
  } else {
    statusKamus = "Kamus tidak dapat dimuat (" + gagal.join(", ") + "), memakai kamus cadangan.";
  }
  perbarui();
}

const NAMA = { id: "Indonesia", mtw: "Mentawai" };
const $ = (id) => document.getElementById(id);

/* ---------- Mode gelap / terang ---------- */
const BULAN = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M20 14.5A8.5 8.5 0 0 1 9.5 4a.5.5 0 0 0-.7-.5A9.5 9.5 0 1 0 20.5 15.2a.5.5 0 0 0-.5-.7z"/></svg>';
const MATAHARI = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></g></svg>';

function setTema(t) {
  document.documentElement.dataset.theme = t;
  $("tema").innerHTML = t === "dark" ? MATAHARI : BULAN;
  $("tema").style.color = t === "dark" ? "#f59e0b" : "#ffd54a";
  try { localStorage.setItem("tema", t); } catch (e) {}
}
let temaAwal = "light";
try { temaAwal = localStorage.getItem("tema") || "light"; } catch (e) {}
setTema(temaAwal);
$("tema").addEventListener("click", () => {
  setTema(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
});

/* ---------- Penerjemah ---------- */
const MAKS_FRASA = 4;

function bangunKamus(dari) {
  const peta = new Map();
  if (dari === "id") KELAS_ID = new Map();
  KAMUS.forEach(([id, mt, kelas]) => {
    if (dari === "id" && kelas) id.forEach((x) => { if (!KELAS_ID.has(x.toLowerCase())) KELAS_ID.set(x.toLowerCase(), kelas); });
    const [kunci, nilai] = dari === "id" ? [id, mt[0]] : [mt, id[0]];
    kunci.forEach((k) => {
      const kk = k.toLowerCase();
      const arr = peta.get(kk) || [];
      if (!arr.includes(nilai)) arr.push(nilai);
      peta.set(kk, arr);
    });
  });
  return peta;
}

function ambilArti(arr, frasa, ganda) {
  if (arr.length > 1) ganda.push(frasa + " → " + arr.join(" / "));
  return arr[0];
}

/* ==== MESIN IMBUHAN ==== */
let IMBUHAN = [];   // dari imbuhan.csv
let SANDHI = [];    // dari sandhi.csv
let statusAturan = "";
let KELAS_ID = new Map();   // kata Indonesia -> n / v / adj

function normKelas(x) {
  const k = (x || "").trim().toLowerCase();
  if (["n", "nomina", "noun"].includes(k)) return "n";
  if (["v", "verba", "verb"].includes(k)) return "v";
  if (["adj", "adjektiva", "adjective"].includes(k)) return "adj";
  return "";
}

// Mentawai: tempel awalan ke kata dasar, dengan aturan sandhi (luluh dll.)
function tempelMTW(awalan, dasar) {
  const r = SANDHI.find((x) => x.awalan === awalan && dasar.startsWith(x.awal_dasar));
  if (!r) return awalan + dasar;
  return r.awalan_jadi + (r.hapus_awal === "1" ? dasar.slice(r.awal_dasar.length) : dasar);
}

// Mentawai: lepas awalan (kebalikan sandhi); mengembalikan semua kemungkinan dasar
function lepasMTW(kata) {
  const hasil = [];
  const urut = [...IMBUHAN].sort((a, b) => b.mentawai.length - a.mentawai.length);
  for (const im of urut) {
    const aw = im.mentawai;
    const calon = new Set();
    SANDHI.filter((x) => x.awalan === aw && kata.startsWith(x.awalan_jadi)).forEach((x) => {
      const sisa = kata.slice(x.awalan_jadi.length);
      calon.add(x.hapus_awal === "1" ? x.awal_dasar + sisa : sisa);
    });
    if (kata.startsWith(aw)) calon.add(kata.slice(aw.length));
    calon.forEach((d) => { if (d.length > 1 && tempelMTW(aw, d) === kata) hasil.push({ im, dasar: d }); });
  }
  return hasil;
}

// Indonesia: bentuk berimbuhan (me-/pe- mengikuti huruf awal dasar)
function bentukID(aw, d, nasal, ak) {
  let h = aw + d;
  if (nasal === "ya") {
    const a = d[0];
    if ("aiueoghkx".includes(a)) h = aw + "ng" + (a === "k" ? d.slice(1) : d);
    else if ("bfv".includes(a)) h = aw + "m" + d;
    else if (a === "p") h = aw + "m" + d.slice(1);
    else if ("cdjz".includes(a)) h = aw + "n" + d;
    else if (a === "t") h = aw + "n" + d.slice(1);
    else if (a === "s") h = aw + "ny" + d.slice(1);
  }
  return h + (ak || "");
}

function rangkaiID(im, sub) {
  if (im.jenis === "afiks") return bentukID(im.id, sub, im.nasal, im.akhiran);
  if (im.jenis === "kata") return im.id + " " + sub;
  return (im.makna ? im.makna + " " : "") + sub;
}

// Mentawai -> Indonesia untuk satu kata (langsung, atau lepas imbuhan lalu cari dasarnya)
function artiMTW(kata, peta, depth = 2) {
  const langsung = peta.get(kata);
  if (langsung) return langsung[0];
  if (depth === 0) return null;
  for (const { im, dasar } of lepasMTW(kata)) {
    const sub = artiMTW(dasar, peta, depth - 1);
    if (sub !== null) return rangkaiID(im, sub);
  }
  return null;
}

// Indonesia: lepas awalan (dan akhiran untuk apitan), semua kemungkinan dasar
const NASAL_ID = (b) => [[b, ""], [b + "nge", ""], [b + "ng", "k"], [b + "ng", ""], [b + "ny", "s"], [b + "n", "t"], [b + "n", ""], [b + "m", "p"], [b + "m", ""]];
function lepasID(kata) {
  const hasil = [], lihat = new Set();
  const urut = IMBUHAN.filter((r) => r.jenis === "afiks")
    .sort((a, b) => (b.id.length + (b.akhiran || "").length) - (a.id.length + (a.akhiran || "").length));
  for (const im of urut) {
    const ak = im.akhiran || "";
    const kunci = im.id + "|" + ak;
    if (lihat.has(kunci)) continue;
    lihat.add(kunci);
    if (ak && !kata.endsWith(ak)) continue;
    const inti = ak ? kata.slice(0, -ak.length) : kata;
    (im.nasal === "ya" ? NASAL_ID(im.id) : [[im.id, ""]]).forEach(([b, tambah]) => {
      if (inti.startsWith(b) && inti.length > b.length) hasil.push({ im, dasar: tambah + inti.slice(b.length) });
    });
  }
  return hasil;
}

// Indonesia -> Mentawai untuk satu kata
function artiID(kata, peta, ganda, depth = 2) {
  const langsung = peta.get(kata);
  if (langsung) return langsung[0];
  if (depth === 0) return null;
  for (const { im, dasar } of lepasID(kata)) {
    const sub = artiID(dasar, peta, ganda, depth - 1);
    if (sub === null) continue;
    let baris = IMBUHAN.filter((r) => r.jenis === "afiks" && r.id === im.id && (r.akhiran || "") === (im.akhiran || ""));
    const kelas = KELAS_ID.get(dasar) || "";
    const cocok = baris.filter((r) => !r.kelas_dasar || !kelas || r.kelas_dasar.split("|").includes(kelas));
    if (cocok.length) baris = cocok;
    const bentuk = baris.map((r) => tempelMTW(r.mentawai, sub));
    if (bentuk.length > 1) ganda.push(kata + " → " + bentuk.join(" / "));
    return bentuk[0];
  }
  return null;
}

function terjemah(teks, dari, ke) {
  const peta = bangunKamus(dari);
  const token = teks.match(/[\p{L}\p{N}'’-]+|[^\p{L}\p{N}\s]|\s+/gu) || [];
  const kata = [];
  token.forEach((t, i) => { if (/[\p{L}\p{N}]/u.test(t)) kata.push(i); });
  const tidakAda = new Set(), ganda = [], diganti = {};
  const cari = (w) => (dari === "id" ? artiID(w.toLowerCase(), peta, ganda) : artiMTW(w.toLowerCase(), peta));

  let k = 0;
  while (k < kata.length) {
    const w = token[kata[k]].toLowerCase();
    // 1. kata pengimbuh (sedang, yang, tanpa) + kata sesudahnya
    const rk = dari === "id" && k + 1 < kata.length && IMBUHAN.find((r) => r.jenis === "kata" && r.id === w);
    if (rk) {
      const sub = cari(token[kata[k + 1]]);
      if (sub !== null) {
        diganti[kata[k]] = { akhir: kata[k + 1], teks: tempelMTW(rk.mentawai, sub) };
        k += 2;
        continue;
      }
    }
    // 2. kata atau frasa langsung dari kamus
    let ketemu = false;
    for (let n = Math.min(MAKS_FRASA, kata.length - k); n >= 1; n--) {
      const frasa = kata.slice(k, k + n).map((i) => token[i]).join(" ").toLowerCase();
      if (peta.has(frasa)) {
        diganti[kata[k]] = { akhir: kata[k + n - 1], teks: ambilArti(peta.get(frasa), frasa, ganda) };
        k += n; ketemu = true; break;
      }
    }
    if (ketemu) continue;
    // 3. bentuk berimbuhan
    const h = cari(token[kata[k]]);
    if (h !== null) diganti[kata[k]] = { akhir: kata[k], teks: h };
    else {
      tidakAda.add(token[kata[k]]);
      diganti[kata[k]] = { akhir: kata[k], teks: "[" + token[kata[k]] + "]" };
    }
    k++;
  }

  const hasil = [];
  for (let i = 0; i < token.length; i++) {
    if (diganti[i]) { hasil.push(diganti[i].teks); i = diganti[i].akhir; }
    else hasil.push(token[i]);
  }
  return { teks: hasil.join(""), tidakAda: [...tidakAda], ganda };
}

async function muatAturan() {
  try {
    const baca = async (f) => {
      const res = await fetch(f, { cache: "no-store" });
      if (!res.ok) throw new Error(f + " HTTP " + res.status);
      const t = bacaCSV((await res.text()).replace(/^\uFEFF/, ""));
      const kepala = t[0].map((h) => h.trim().toLowerCase());
      return t.slice(1).map((r) => Object.fromEntries(kepala.map((h, i) => [h, (r[i] || "").trim()])));
    };
    IMBUHAN = (await baca(SUMBER_IMBUHAN)).filter((r) => r.mentawai);
    SANDHI = (await baca(SUMBER_SANDHI)).filter((r) => r.awalan);
    statusAturan = IMBUHAN.length + " aturan imbuhan dimuat.";
  } catch (e) {
    statusAturan = "Aturan imbuhan tidak dimuat (" + e.message + ").";
  }
  perbarui();
}
/* ==== AKHIR MESIN IMBUHAN ==== */

function perbarui() {
  const dari = $("sumber").value, ke = $("sasaran").value, teks = $("input").value;
  const info = $("info"), keluar = $("hasil");
  if (!dari || !ke) { keluar.value = ""; info.textContent = "Pilih bahasa sumber dan bahasa sasaran."; return; }
  if (dari === ke) { keluar.value = ""; info.textContent = "Bahasa sumber dan sasaran harus berbeda."; return; }
  if (!teks.trim()) { keluar.value = ""; info.textContent = [statusKamus, statusAturan].filter(Boolean).join(" "); return; }
  const r = terjemah(teks, dari, ke);
  keluar.value = r.teks;
  const bagian = [];
  if (r.tidakAda.length) bagian.push("Belum ada di kamus: " + r.tidakAda.join(", "));
  if (r.ganda.length) bagian.push("Bermakna ganda: " + r.ganda.join("; "));
  info.textContent = bagian.length ? bagian.join(". ") : "Semua kata ditemukan di kamus.";
}

// jika kedua pilihan sama, balikkan yang satunya
function jagaBeda(diubah, satunya) {
  if ($(diubah).value && $(diubah).value === $(satunya).value) {
    $(satunya).value = $(diubah).value === "id" ? "mtw" : "id";
  }
  perbarui();
}
$("sumber").addEventListener("change", () => jagaBeda("sumber", "sasaran"));
$("sasaran").addEventListener("change", () => jagaBeda("sasaran", "sumber"));
$("input").addEventListener("input", perbarui);

// nilai awal: Indonesia → Mentawai
$("sumber").value = "id";
$("sasaran").value = "mtw";
/* ---------- Buku, saran, kontribusi ---------- */
const IKON_BUKU = '<svg viewBox="0 0 80 80" aria-hidden="true"><path d="M14 22 38 12l24 36-28 18z" fill="#e9a54f"/><path d="M20 24 38 17l19 30-21 13z" fill="#f0c070"/><path d="M34 60l22-12" stroke="#cfeff2" stroke-width="5"/></svg>';
let waktuToast;
function toast(pesan) {
  const t = $("toast");
  t.textContent = pesan;
  t.classList.add("tampil");
  clearTimeout(waktuToast);
  waktuToast = setTimeout(() => t.classList.remove("tampil"), 2800);
}

function pasangTautan(el, url, pesanKosong) {
  if (url) {
    el.href = url;
    if (!url.startsWith("mailto:")) { el.target = "_blank"; el.rel = "noopener noreferrer"; }
  } else {
    el.addEventListener("click", (e) => { e.preventDefault(); toast(pesanKosong); });
  }
}

BUKU.forEach((b) => {
  const kartu = document.createElement(b.judul ? "a" : "div");
  kartu.className = "kartu" + (b.judul ? "" : " nonaktif");
  if (b.judul) {
    kartu.href = "#";
    kartu.innerHTML = IKON_BUKU + '<div class="teks"><b></b><span></span></div>';
    kartu.querySelector("b").textContent = b.judul;
    kartu.querySelector("span").textContent = b.ket || "";
    pasangTautan(kartu, b.url, "Tautan buku ini belum diisi.");
  } else {
    kartu.setAttribute("aria-disabled", "true");
    kartu.textContent = "Segera hadir";
  }
  $("buku").appendChild(kartu);
});

pasangTautan($("saran"), LINK_SARAN, "Tautan saran dan kritik belum diisi.");
pasangTautan($("kontribusi"), LINK_KONTRIBUSI, "Tautan kontribusi belum diisi.");

muatKamus();
muatAturan();
</script>
